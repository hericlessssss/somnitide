spring.application.name=somnitide

# Server
server.port=8080

# Datasource — set via environment variables (see .env / .env.exemple)
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Supabase JWKS endpoint for JWT validation (ETAPA 3)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://kkrwcwimkmpeexjhadlt.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

# Logging
logging.file.name=backend.log
logging.level.dev.somnitide=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security.oauth2.server.resource=DEBUG
logging.level.org.flywaydb=INFO
