name: SomniTide CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  checks: write
  pull-requests: write

jobs:
  backend:
    name: Backend CI (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend
        run: mvn -pl backend clean test package -DskipTests=false
        env:
          SUPABASE_JWKS_URI: https://mock.supabase.co/auth/v1/get_jwks

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Tests
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/somnitide-backend-0.0.1-SNAPSHOT.jar

  publish-docker:
    name: Publish Backend Docker Image
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/somnitide-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  frontend:
    name: Frontend CI (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Tests
        run: npm test
        working-directory: frontend

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend Tests
          path: frontend/test-results.xml
          reporter: java-junit

      - name: Build Frontend
        run: npm run build
        working-directory: frontend

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/frontend

  ci-success:
    name: CI overall success
    needs: [backend, publish-docker, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status of all jobs
        run: |
          if [[ "${{ needs.backend.result }}" == "success" && \
                ("${{ needs.publish-docker.result }}" == "success" || "${{ needs.publish-docker.result }}" == "skipped") && \
                "${{ needs.frontend.result }}" == "success" ]]; then
            echo "All required jobs passed!"
            exit 0
          else
            echo "One or more jobs failed."
            exit 1
          fi
